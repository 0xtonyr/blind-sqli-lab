<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="https://unpkg.com/htmx.org@1.5.0"></script>
</head>
<body>
    <div class="container">
        <h2>Create your Account</h2>
        <form action="/submit" method="post">
            <!-- Username with real-time availability check -->
            <label for="username">Username:</label>
            <input type="text" id="username" name="username"
                   hx-get="/check-username"
                   hx-target="#username-check"
                   hx-trigger="keyup changed delay:500ms">
            <div id="username-check" class="username-status"></div>

            <!-- Email with real-time availability check -->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   hx-get="/check-email"
                   hx-target="#email-check"
                   hx-trigger="keyup changed delay:500ms">
            <div id="email-check" class="email-status"></div>

            <!-- Password -->
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <!-- Register button -->
            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
